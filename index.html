<title>鹈鹕骑行日 · Pelican's Ride</title>
<link rel="icon" href="data:,">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { background: #7db9f0; font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif; }

  svg.scene { display: block; width: 100vw; height: 100vh; }

  /* ---------- 视差滚动层 ---------- */
  @keyframes pan800 { to { transform: translateX(-800px); } }
  .pan-clouds { animation: pan800 90s linear infinite; }
  .pan-hills  { animation: pan800 32s linear infinite; }
  .pan-trees  { animation: pan800 7.5s linear infinite; }

  /* ---------- 路面虚线（周期 160px，无缝循环） ---------- */
  @keyframes pan160 { to { transform: translateX(-160px); } }
  .pan-dash { animation: pan160 0.45s linear infinite; }

  /* ---------- 骑手整体上下颠簸 ---------- */
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  #rider { animation: bob 0.6s ease-in-out infinite; }

  /* ---------- 眨眼 ---------- */
  .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.6s infinite; }
  @keyframes blink { 0%, 43%, 50%, 100% { transform: scaleY(1); } 46.5% { transform: scaleY(0.08); } }

  /* ---------- 地面阴影脉动 ---------- */
  .shadowPulse { transform-box: fill-box; transform-origin: center; animation: sh 0.6s ease-in-out infinite; }
  @keyframes sh { 0%, 100% { opacity: 0.16; transform: scaleX(1); } 50% { opacity: 0.11; transform: scaleX(0.96); } }

  /* ---------- 速度线 ---------- */
  .sp { opacity: 0; animation: sp 1.2s linear infinite; }
  .sp2 { animation-delay: 0.4s; }
  .sp3 { animation-delay: 0.8s; }
  @keyframes sp {
    0%   { opacity: 0; transform: translateX(14px); }
    55%  { opacity: 0.5; }
    100% { opacity: 0; transform: translateX(-26px); }
  }

  /* ---------- 远处飞鸟 ---------- */
  .drift { animation: drift 7s ease-in-out infinite alternate; }
  .drift2 { animation-duration: 9s; animation-delay: -3s; }
  @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(-36px, 8px); } }

  /* ---------- 标题卡片 ---------- */
  .card {
    position: fixed; top: 22px; left: 24px; z-index: 10;
    padding: 14px 20px 13px;
    background: rgba(255, 255, 255, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.7);
    border-radius: 16px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 8px 30px rgba(40, 70, 120, 0.18);
    color: #1f3a56;
    user-select: none;
    pointer-events: none;
  }
  .card h1 { font-size: 22px; letter-spacing: 1px; }
  .card p  { font-size: 12px; margin-top: 4px; opacity: 0.75; letter-spacing: 0.5px; }

  .badge {
    position: fixed; right: 20px; bottom: 16px; z-index: 10;
    font-size: 11px; color: rgba(255,255,255,0.9);
    background: rgba(31, 58, 86, 0.35);
    padding: 6px 12px; border-radius: 999px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    user-select: none;
    pointer-events: none;
    letter-spacing: 0.5px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>
